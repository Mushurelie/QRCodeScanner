name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compiler
        run: dotnet build src/QRCodeScanner/QRCodeScanner.csproj -c Release -v minimal

      - name: Verifier que l'exe encode puis relit un QR code
        shell: pwsh
        run: |
          $exe = 'src/QRCodeScanner/bin/Release/QRCodeScanner.exe'
          $expected = 'https://github.com/${{ github.repository }}'
          # Une app GUI ne bloque pas le shell : on attend explicitement.
          Start-Process $exe -ArgumentList '--make-qr', $expected, 'sample.png' -Wait -NoNewWindow
          Start-Process $exe -ArgumentList '--scan-file', 'sample.png' -Wait -NoNewWindow -RedirectStandardOutput 'decoded.txt'
          $decoded = (Get-Content 'decoded.txt' -Raw).Trim()
          if ($decoded -ne $expected) {
            throw "Decodage incorrect : '$decoded' au lieu de '$expected'"
          }
          Write-Output "OK : $decoded"

      - uses: actions/upload-artifact@v4
        with:
          name: QRCodeScanner
          path: src/QRCodeScanner/bin/Release/QRCodeScanner.exe
          if-no-files-found: error

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/QRCodeScanner/bin/Release/QRCodeScanner.exe
          generate_release_notes: true
